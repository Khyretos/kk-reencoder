# Kreative Reencoder: AV1 re-encoder with a web page.
#
#   1. Put your media folder(s) under "volumes" below (or set RX_MEDIA_DIR in .env).
#   2. docker compose up -d --build
#   3. Open http://127.0.0.1:8080 and pick a mode in Settings (it starts in Report: measure only, nothing changes).
#
# Without cloning the repo: keep only this file and set RX_BUILD_CONTEXT=https://github.com/Khyretos/kk-reencoder.git
# in .env (Compose builds straight from git). Every setting can come from .env (see .env.example); most can also
# be changed on the Settings screen. GPU and reverse-proxy wiring: docker-compose.override.example.yml.
# It has no login of its own: put it behind a sign-in before opening it to the network.
services:
  reencoder:
    build:
      context: ${RX_BUILD_CONTEXT:-.}
      args:
        RX_BASE_IMAGE: ${RX_BASE_IMAGE:-debian:trixie-slim}
        RX_UID: ${RX_UID:-1000}
        RX_GID: ${RX_GID:-1000}
    image: ${RX_IMAGE:-kk-reencoder:local}
    restart: unless-stopped
    user: "${RX_UID:-1000}:${RX_GID:-1000}"
    volumes:
      # The library. Every folder directly under /media is one library (Movies, Series, Anime, ...).
      # One host folder that holds them all:
      - ${RX_MEDIA_DIR:-./media}:/media
      # ...or one line per folder, each mounted as its own library (then remove the line above):
      # - /mnt/disk1/Movies:/media/Movies
      # - /mnt/disk2/TV:/media/Series
      # Read-write: re-encodes go into hidden .reencoder folders next to the originals until you finalize.
      - reencoder-data:/data     # database, comparison frames, reports, samples
    ports:
      - "${RX_BIND:-127.0.0.1}:${RX_HOST_PORT:-8080}:8080"
    environment:
      # what to work on
      RX_ROOTS: ${RX_ROOTS:-}
      RX_MODE: ${RX_MODE:-report}
      RX_CODECS: ${RX_CODECS:-h264,hevc,mpeg4,vc1,mpeg2video,wmv3,msmpeg4v3}
      RX_SKIP_HDR: ${RX_SKIP_HDR:-true}
      RX_MAX_HEIGHT: ${RX_MAX_HEIGHT:-2160}
      # hardware: auto finds an Intel, AMD or NVIDIA GPU passed in (see the override example) and tests it,
      # else uses the CPU (SVT-AV1)
      RX_ENCODER: ${RX_ENCODER:-auto}
      RX_DEVICE: ${RX_RENDER_DEVICE:-/dev/dri/renderD128}
      RX_HW_DECODE: ${RX_HW_DECODE:-true}
      RX_PARALLEL: ${RX_PARALLEL:-2}
      RX_VMAF_THREADS: ${RX_VMAF_THREADS:-4}
      RX_VMAF_GPU: ${RX_VMAF_GPU:-auto}
      RX_FFMPEG_THREADS: ${RX_FFMPEG_THREADS:-2}
      # quality
      RX_TARGET_VMAF: ${RX_TARGET_VMAF:-95}
      RX_MAX_RATIO: ${RX_MAX_RATIO:-0.95}
      RX_FILTERS: ${RX_FILTERS:-}
      RX_SAMPLES: ${RX_SAMPLES:-3}
      RX_SAMPLE_LEN: ${RX_SAMPLE_LEN:-20}
      RX_SEARCH_PER_FOLDER: ${RX_SEARCH_PER_FOLDER:-2}
      RX_CHECK_EVERY_EPISODE: ${RX_CHECK_EVERY_EPISODE:-true}
      # space and housekeeping
      RX_MAX_STAGED_GB: ${RX_MAX_STAGED_GB:-1000}
      RX_RESCAN_S: ${RX_RESCAN_S:-86400}
      RX_PORT: "8080"
      TZ: ${TZ:-UTC}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${RX_MEM_LIMIT:-3g}
    memswap_limit: ${RX_MEM_LIMIT:-3g}
    cpus: ${RX_CPUS:-4}
    cpu_shares: 128
    pids_limit: 256
    blkio_config:
      weight: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  reencoder-data:
