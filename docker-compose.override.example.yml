# Copy to docker-compose.override.yml and keep the parts you need; `docker compose up -d` picks it up.
# Values come from .env. With RX_ENCODER=auto (the default) the service finds what you pass in here and tests it.
services:
  reencoder:
    # --- Intel or AMD GPU (Quick Sync / VA-API) ---------------------------------------------------------------
    # Pass the render node in and join its group. RX_RENDER_GID is the host's render group:
    #   getent group render | cut -d: -f3
    devices:
      - ${RX_RENDER_DEVICE:-/dev/dri/renderD128}:${RX_RENDER_DEVICE:-/dev/dri/renderD128}
    group_add:
      - "${RX_RENDER_GID:-993}"

    # --- NVIDIA GPU (NVENC, RTX 40 or newer for AV1) ------------------------------------------------------------
    # Needs the NVIDIA Container Toolkit on the host. Use this instead of the devices/group_add lines above.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video, compute, utility]

    # --- Behind a reverse proxy on a Docker network -----------------------------------------------------------
    # Join the proxy's network and publish no host port; point the proxy at reencoder:8080.
    # ports: !reset []
    # networks:
    #   - proxy

# networks:
#   proxy:
#     external: true
#     name: ${RX_PROXY_NETWORK:-proxy}
