<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Reencoder</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="/static/favicon-32.png">
</head>
<body>
    <header class="top appbar">
        <a class="brand" href="/" aria-label="Reencoder home">
            <picture>
                <source media="(prefers-color-scheme: dark)" srcset="/static/logo-on-dark.svg">
                <img src="/static/logo.svg" alt="">
            </picture>
            <span class="name">Reencoder</span>
            <span class="ver" id="ver"></span>
        </a>
        <nav class="nav tabs" aria-label="Pages">
            <a href="/" class="navlink active" aria-current="page">Library</a>
            <a href="/overview" class="navlink">Overview</a>
        </nav>
        <nav class="controls" aria-label="Encoder controls">
            <span id="mode" class="badge"></span>
            <span id="runstate" class="runstate" role="status" aria-live="polite"><i class="dot"></i><span class="rs-text">Connecting…</span></span>
            <button id="pause" type="button" class="btn btn-run" aria-pressed="false"><span class="ico" aria-hidden="true"></span><span class="lbl">Pause</span></button>
        </nav>
    </header>

    <main>
        <section id="tiles">
            <div class="tile t-progress">
                <div class="tile-label">Re-encoded</div>
                <div class="tile-value"></div>
                <div class="tile-sub"></div>
                <div class="tile-meter"><i></i></div>
            </div>
            <div class="tile t-saved">
                <div class="tile-label">Saved so far</div>
                <div class="tile-value"></div>
                <div class="tile-sub"></div>
            </div>
            <div class="tile t-disk">
                <div class="tile-label">On disk now</div>
                <div class="tile-value"></div>
                <div class="tile-sub"></div>
            </div>
            <div class="tile t-expected">
                <div class="tile-label">Expected when done</div>
                <div class="tile-value"></div>
                <div class="tile-sub"></div>
            </div>
        </section>

        <div id="notice" role="status" hidden></div>

        <section id="progress" class="card">
            <h2>Progress per library</h2>
            <div id="libprogress"></div>
        </section>

        <section id="jobs" class="card">
            <h2>Encoding now</h2>
            <div class="jobs-bar">
                <p id="sysline"></p>
                <label class="parallel-ctl" for="parallel">Encodes at once
                    <input type="number" id="parallel" min="1" max="5">
                </label>
            </div>
            <div id="job-list"></div>
        </section>

        <section id="space" class="card">
            <h2>Space used by copies waiting for confirm</h2>
            <div class="bar">
                <div id="space-fill" class="fill"></div>
            </div>
            <p id="space-text"></p>
        </section>

        <nav class="toolbar">
            <input type="search" id="q" placeholder="Search series or movies" aria-label="Search series or movies">
            <select id="filter">
                <option value="all">All</option>
                <option value="notstarted">Not started</option>
                <option value="partial">Partly done</option>
                <option value="ready">Ready to confirm</option>
                <option value="finalize">Ready to finalize</option>
                <option value="done">Done</option>
                <option value="skipped">Skipped</option>
                <option value="failed">Failed</option>
            </select>
            <div class="viewsw">
                <button id="view-grid" class="btn" aria-pressed="true"></button>
                <button id="view-list" class="btn"></button>
            </div>
        </nav>

        <p id="filter-sum" role="status" hidden></p>
        <section id="folders"></section>
    </main>

    <dialog id="detail">
        <div class="detail-header">
            <h3 id="detail-title"></h3>
            <p id="detail-sum"></p>
            <button id="detail-close" class="btn" aria-label="Close">×</button>
        </div>
        <div id="detail-actions"></div>
        <div id="compare" hidden></div>
        <div id="detail-body"></div>
        <div class="detail-footer">
            <a id="detail-json" class="btn" download="encoding_report.json">Download encoding_report.json</a>
        </div>
    </dialog>

    <script src="/static/shell.js" defer></script>
    <script src="/static/fold.js" defer></script>
    <script src="/static/progress.js" defer></script>
    <script src="/static/compare.js" defer></script>
    <script src="/static/detail.js" defer></script>
    <script src="/static/app.js" defer></script>
    <script src="/static/settings.js" defer></script>
    <script src="/static/queue.js" defer></script>
</body>
</html>
