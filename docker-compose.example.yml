# kk-reencoder for your own PC or server: copy this file next to the repo as docker-compose.yml,
# adjust the marked lines and run `docker compose up -d`. Then open http://127.0.0.1:8080
# (put it behind a sign-in before you open it to the network: it has no login of its own).
services:
  reencoder:
    build: .
    image: kk-reencoder
    container_name: reencoder
    restart: unless-stopped
    user: "1000:1000"            # ADJUST: the uid:gid that owns your media files (`id -u`, `id -g`)
    group_add:
      - "993"                     # ADJUST: your render group (`getent group render`), for the GPU
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128   # ADJUST: your GPU (Intel/AMD); remove for RX_ENCODER=svt
    volumes:
      # ADJUST: one line per library folder. Add :ro for RX_MODE=report (measure only).
      - /srv/media/Anime:/media/Anime
      - /srv/media/Movies:/media/Movies
      - /srv/media/Series:/media/Series
      - reencoder-data:/data       # database, comparison frames, reports, samples
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # --- what to work on ---
      - RX_ROOTS=/media/Anime,/media/Movies,/media/Series   # the library folders inside the container
      - RX_MODE=manual            # report = measure only; manual = only series you tick get encoded; stage = encode everything
      - RX_CODECS=h264,hevc,mpeg4,vc1,mpeg2video,wmv3,msmpeg4v3   # source codecs to consider (AV1 is always skipped)
      - RX_SKIP_HDR=true          # leave HDR files alone
      - RX_MAX_HEIGHT=2160        # skip anything taller (8K)
      # --- hardware ---
      - RX_ENCODER=qsv            # qsv (Intel Arc/iGPU), vaapi (Intel/AMD), nvenc (NVIDIA, also add the GPU to the container), svt (CPU only, slow)
      - RX_DEVICE=/dev/dri/renderD128   # the GPU for qsv/vaapi
      - RX_HW_DECODE=true         # qsv: decode + 10-bit conversion on the GPU too (about 5x faster); falls back to CPU per file
      - RX_PARALLEL=2             # encodes at once (1-5), also adjustable on the page
      - RX_VMAF_THREADS=3         # CPU threads per quality check
      # --- quality ---
      - RX_TARGET_VMAF=95         # minimum VMAF score (95 is visually the same for most people)
      - RX_MAX_RATIO=0.8          # only keep a re-encode that is at most 80% of the original size
      - RX_FILTERS=               # optional CPU filters per library, e.g. Anime=deband (much slower; leave empty for full GPU speed)
      - RX_SAMPLES=3              # samples per file for the quality search
      - RX_SAMPLE_LEN=20          # seconds per sample
      - RX_SEARCH_PER_FOLDER=2    # full searches per series; later episodes reuse that quality with one check sample
      - RX_CHECK_EVERY_EPISODE=true   # false: skip that check sample too (mostly GPU work); also on the Settings screen
      # --- space and housekeeping ---
      - RX_MAX_STAGED_GB=1000     # pause when re-encodes waiting for Confirm plus kept originals exceed this
      - RX_RESCAN_S=86400         # rescan the library once a day (in the background); also on the Settings screen
      - TZ=Europe/Amsterdam
    mem_limit: 3g                 # keep the encoder polite next to your other services
    cpus: 4
    cpu_shares: 128
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  reencoder-data:
